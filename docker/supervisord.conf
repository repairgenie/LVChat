# LVChat supervisord config for the Docker image.
# Runs nginx, php-fpm, and the Workerman realtime gateway in one container.
# All three run as www-data and share the SQLite DB on the /var/www/html/data
# volume.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The realtime gateway. It refuses to start without pcntl/posix (both installed
; in this image). When Admin -> Settings -> Realtime mode is not "WebSocket"
; the daemon idles harmlessly and clients keep using polling/SSE, so you can
; flip the mode on without rebuilding or restarting the container.
[program:ws-server]
command=/usr/local/bin/php /var/www/html/bin/ws-server.php start
user=www-data
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

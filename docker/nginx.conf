# LVChat nginx vhost for the Docker image.
# Document root is public/ (the only web-served folder). Everything that is
# not a real file/dir falls through to index.php (front-controller rewrite).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Simple liveness endpoint for the container healthcheck (no DB, no PHP).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_index index.php;
    }

    # Static assets: long cache (the app cache-busts with ?v=<file-mtime>).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|wav|mp3|webp|json)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploads are runtime state and may change name-less often.
    location ^~ /uploads/ {
        expires 1d;
        add_header Cache-Control "public";
    }
}

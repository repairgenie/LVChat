# LVChat nginx vhost for the Docker image.
# Document root is public/ (the only web-served folder). Everything that is
# not a real file/dir falls through to index.php (front-controller rewrite).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Hide nginx version from response headers and error pages.
    server_tokens off;

    root /var/www/html/public;
    index index.php;

    # Maximum upload size — must be larger than PHP's upload_max_filesize (8M).
    client_max_body_size 10M;

    # --- Security headers (defense-in-depth: PHP also sets these) -----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: only when TLS is terminated at nginx (not plain HTTP inside Docker).
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- gzip compression ---------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2;

    # Simple liveness endpoint for the container healthcheck (no DB, no PHP).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_index index.php;
    }

    # Static assets: long cache (the app cache-busts with ?v=<file-mtime>).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|wav|mp3|webp|json)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploads are runtime state and may change name-less often.
    location ^~ /uploads/ {
        expires 1d;
        add_header Cache-Control "public";
        # Deny PHP execution inside uploads — prevents uploaded scripts from running.
        location ~* \.php$ {
            deny all;
        }
    }
}

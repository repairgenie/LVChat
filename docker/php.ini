; LVChat PHP settings for the Docker image.
; Override any of these by mounting your own file into
; /usr/local/etc/php/conf.d/ (zz-lvchat.ini sorts last, so your file wins only
; if it sorts after it — use a zz-prefix like zzz-custom.ini).

; Production: log errors server-side, never display them.
display_errors = Off
log_errors = On
error_reporting = E_ALL
log_errors_max_len = 0

; Upload limits (chat images 5MB, avatars 1MB, sound alerts 2MB per the docs).
upload_max_filesize = 8M
post_max_size = 16M

; opcache for the PHP-FPM workers.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; SQLite needs a bit of room.
memory_limit = 256M

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #313338;
      color: #dbe0e4;
      font-family: "gg sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .mark {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #5865f2;
      color: #fff;
      font-size: 34px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 { font-size: 20px; margin: 0; color: #f2f3f5; }
    p { margin: 0; font-size: 14px; color: #9aa0a6; max-width: 380px; line-height: 1.5; }
    .hint { font-size: 12px; color: #6d737c; }
    a, button {
      margin-top: 6px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 18px;
      border: 0;
      border-radius: 6px;
      background: #5865f2;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
    }
    a:hover, button:hover { background: #4752c4; }
  </style>
</head>
<body>
  <div class="mark">#</div>
  <h1>You're offline</h1>
  <p>This page hasn't been viewed on this device yet, so there's nothing saved to show while the connection is down.</p>
  <p class="hint">Reconnect to chat — anything you sent while offline is queued and will be delivered automatically.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>

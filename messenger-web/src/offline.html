<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#26283c" />
  <title>LVChat Messenger — offline</title>
  <style>
    body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #1a1a24; color: #e3e5e8; font: 15px/1.5 system-ui, sans-serif; }
    .card { text-align: center; max-width: 420px; padding: 32px; }
    .logo { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 14px; background: #26283c; display: grid; place-items: center; font-size: 26px; font-weight: 700; color: #fff; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 4px; color: #a6a9b3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">LV</div>
    <h1>You’re offline</h1>
    <p>The messenger needs a connection to your LVChat server to sign in.</p>
    <p>Reconnect and try again — messages you send while offline will be queued.</p>
  </div>
</body>
</html>
